<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multiplayer Neon Twin Stick Shooter – PeerJS</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        #lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #00ffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-bottom: 10px;
        }

        .lobby-box {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00ffff;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        button {
            background: #00ffff;
            color: #050510;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: all 0.2s;
        }

        button:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 15px #ff00ff;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .sector-buttons {
            display: grid;
            gap: 10px;
        }

        .sector-btn {
            margin: 0;
        }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            word-break: break-all;
        }
    </style>
</head>

<body>
    <div id="lobby-overlay">
        <h1>NEON SURVIVORS</h1>
        <p>Twin-Stick Co-op Multiplayer</p>
        <div class="lobby-box">
            <p>Select a mission to host or join.</p>
            <div class="sector-buttons" id="mission-buttons"></div>
            <div id="lobby-status" class="status-text">Choose a mission to host or join.</div>
        </div>
    </div>

    <div id="game-container"></div>

    <script type="module" src="/src/main.ts"></script>
</body>

</html>
