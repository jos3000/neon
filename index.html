<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Multiplayer Neon Twin Stick Shooter – PeerJS</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050510;
            overflow: hidden;
            touch-action: none;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
        }

        #lobby-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #00ffff;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 2.5rem;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
            margin-bottom: 10px;
        }

        .lobby-box {
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid #00ffff;
            padding: 20px;
            border-radius: 10px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        button {
            background: #00ffff;
            color: #050510;
            border: none;
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 0;
            width: 100%;
            transition: all 0.2s;
        }

        button:hover {
            background: #ff00ff;
            color: #fff;
            box-shadow: 0 0 15px #ff00ff;
        }

        input {
            background: #111;
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 10px #00ffff;
        }

        .status-text {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            word-break: break-all;
        }
    </style>
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- PeerJS -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
</head>

<body>
    <div id="lobby-overlay">
        <h1>NEON SURVIVORS</h1>
        <p>Twin-Stick Co-op Multiplayer</p>
        <div class="lobby-box">
            <button id="btn-host">HOST NEW GAME</button>
            <hr style="border-color: #00ffff33; margin: 15px 0;" />
            <input type="text" id="input-host-id" placeholder="Enter Host Peer ID to Join" />
            <button id="btn-join">JOIN GAME</button>
            <div id="lobby-status" class="status-text">Ready. Host or join using a Peer ID.</div>
        </div>
    </div>

    <div id="game-container"></div>

    <script src="game.js"></script>
</body>

</html>
